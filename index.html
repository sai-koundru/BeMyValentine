<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #f6d1e7, #e3d7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: #fffafc;
      padding: 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(120, 90, 160, 0.25);
      max-width: 360px;
      width: 90%;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #8b5fbf;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p {
      color: #6b5a75;
      margin-bottom: 20px;
      font-size: 15px;
    }

    img {
      width: 100%;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff8fb1, #ff6f91);
      color: white;
      box-shadow: 0 8px 18px rgba(255, 111, 145, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      background: #e6e0ea;
      color: #5c4b66;
      position: relative;
    }

    .shake {
      animation: shake 0.3s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .hidden {
      display: none;
    }

    .loader {
      font-size: 18px;
      color: #8b5fbf;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .message {
      font-size: 15px;
      line-height: 1.7;
      color: #5f4b66;
    }

    h2 {
      color: #ff6f91;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="card" id="mainCard">
    <h1 id="nameText"></h1>
    <p>Will you be my Valentine? 💗</p>

    <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYXN2cjFzbnptc29ncjNyMjc5bGdnYWNveGQxdDd2bHVlZGlwNTEzaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/IzXiddo2twMmdmU8Lv/giphy.gif" />

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😶</button>
    </div>
  </div>

  <div class="card hidden" id="loaderCard">
    <p class="loader">Checking compatibility… 💞</p>
  </div>

  <div class="card hidden" id="messageCard">
    <p class="message">
      I didn’t make this to impress you.<br><br>
      I made this because you matter to me.<br><br>
      Because every time I think of happiness, somehow you’re part of it.<br><br>
      I really hope this made you smile 💖
    </p>
    <h2>💘 100% MATCH FOUND 💘</h2>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    /* NAME TYPING */
    const name = "Junior ❤️";
    let i = 0;
    const nameText = document.getElementById("nameText");

    function typeName() {
      if (i < name.length) {
        nameText.textContent += name.charAt(i);
        i++;
        setTimeout(typeName, 120);
      }
    }
    typeName();

    /* NO BUTTON LOGIC */
    let noCount = 0;
    const noBtn = document.getElementById("noBtn");

    noBtn.addEventListener("click", () => {
      noCount++;

      if (noCount === 1) {
        noBtn.classList.add("shake");
        setTimeout(() => noBtn.classList.remove("shake"), 300);
      } 
      else if (noCount === 2) {
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 200 - 100;
        noBtn.style.transform = `translate(${x}px, ${y}px)`;
      } 
      else if (noCount === 3) {
        noBtn.textContent = "Okay okay… 🥺";
      } 
      else {
        document.getElementById("yesBtn").click();
      }
    });

    /* YES BUTTON FLOW */
    document.getElementById("yesBtn").addEventListener("click", () => {
      document.getElementById("mainCard").classList.add("hidden");
      document.getElementById("loaderCard").classList.remove("hidden");

      setTimeout(() => {
        document.getElementById("loaderCard").classList.add("hidden");
        document.getElementById("messageCard").classList.remove("hidden");

        confetti({
          particleCount: 160,
          spread: 90,
          origin: { y: 0.6 }
        });
      }, 2200);
    });
  </script>

</body>
</html>
