<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine Junior 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #f6d1e7, #e3d7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: #fffafc;
      padding: 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(120, 90, 160, 0.25);
      max-width: 360px;
      width: 90%;
      animation: pop 0.6s ease;
      position: relative;
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #8b5fbf;
      margin-bottom: 10px;
      font-weight: 700;
      min-height: 40px;
    }

    p {
      color: #6b5a75;
      margin-bottom: 20px;
      font-size: 15px;
    }

    img {
      width: 100%;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      height: 60px;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease;
      position: relative;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff8fb1, #ff6f91);
      color: white;
      box-shadow: 0 8px 18px rgba(255, 111, 145, 0.4);
    }

    #noBtn {
      background: #e6e0ea;
      color: #5c4b66;
    }

    .hidden {
      display: none;
    }

    .message {
      font-size: 15px;
      line-height: 1.7;
      color: #5f4b66;
    }

    h2 {
      color: #ff6f91;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- PAGE 1 -->
  <div class="card" id="mainCard">
    <h1 id="nameText"></h1>
    <p>Will you be my Valentine? 💗</p>

    <!-- CUTE PUG IMAGE -->
    <img src="https://raw.githubusercontent.com/sai-koundru/BeMyValentine/sai-koundru-patch-1/pugcute.jpg" alt="Cute Pug" />


    <div class="buttons" id="buttonZone">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😶</button>
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="card hidden" id="messageCard">
    <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYXN2cjFzbnptc29ncjNyMjc5bGdnYWNveGQxdDd2bHVlZGlwNTEzaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/IzXiddo2twMmdmU8Lv/giphy.gif" />

    <p class="message">
      I didn’t make this to impress you.<br><br>
      I made this because you matter to me.<br><br>
      Because every time I think of happiness, somehow you’re part of it.<br><br>
    </p>

    <h2>illyy Junior 💌</h2>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    /* NAME TYPING */
    const name = "Junior ❤️";
    const nameText = document.getElementById("nameText");
    let i = 0;

    setTimeout(() => {
      function typeName() {
        if (i < name.length) {
          nameText.textContent += name.charAt(i);
          i++;
          setTimeout(typeName, 180);
        }
      }
      typeName();
    }, 800);

    /* NO BUTTON LOGIC */
    const noBtn = document.getElementById("noBtn");
    const zone = document.getElementById("buttonZone");
    let noClicks = 0;

    function moveNoRandom() {
      const zoneRect = zone.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = zoneRect.width - btnRect.width;
      const maxY = zoneRect.height - btnRect.height;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      noClicks++;

      if (noClicks === 1) {
        moveNoRandom();
      }
      else if (noClicks === 2) {
        noBtn.textContent = "plegg 🥹";
        moveNoRandom();
      }
      else {
        noBtn.style.pointerEvents = "none";
      }
    });

    /* RUNAWAY MODE */
    document.addEventListener("mousemove", (e) => {
      if (noClicks >= 3) {
        const r = noBtn.getBoundingClientRect();
        const d = Math.hypot(
          r.left + r.width / 2 - e.clientX,
          r.top + r.height / 2 - e.clientY
        );

        if (d < 120) moveNoRandom();
      }
    });

    /* YES BUTTON */
    document.getElementById("yesBtn").addEventListener("click", () => {
      document.getElementById("mainCard").classList.add("hidden");
      document.getElementById("messageCard").classList.remove("hidden");

      confetti({
        particleCount: 180,
        spread: 100,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
